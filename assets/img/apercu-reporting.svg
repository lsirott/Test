<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="reportTitle reportDesc">
  <title id="reportTitle">Aperçu d'une page 1 de reporting mensuel</title>
  <desc id="reportDesc">Maquette illustrative : en-tête du mois, trois indicateurs clés et un graphique de marge par affaire. Données anonymisées à titre d'exemple.</desc>

  <rect x="0" y="0" width="600" height="440" fill="#ffffff" stroke="#e0ddd5" stroke-width="2"/>

  <!-- en-tête du document -->
  <rect x="0" y="0" width="600" height="56" fill="#132743"/>
  <text x="24" y="35" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Reporting mensuel — Juillet</text>
  <text x="576" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#f6f4ef" text-anchor="end">Page 1 / 4</text>

  <!-- trois indicateurs -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="24" y="80" width="168" height="86" fill="#f6f4ef" stroke="#e0ddd5"/>
    <text x="40" y="106" font-size="12" fill="#4a4a4a">MARGE MOYENNE</text>
    <text x="40" y="140" font-size="26" font-weight="700" fill="#132743">18,4 %</text>

    <rect x="216" y="80" width="168" height="86" fill="#f6f4ef" stroke="#e0ddd5"/>
    <text x="232" y="106" font-size="12" fill="#4a4a4a">TRÉSORERIE 13 SEM.</text>
    <text x="232" y="140" font-size="26" font-weight="700" fill="#132743">+42 K€</text>

    <rect x="408" y="80" width="168" height="86" fill="#f6f4ef" stroke="#e0ddd5"/>
    <text x="424" y="106" font-size="12" fill="#4a4a4a">ATTERRISSAGE BUDGET</text>
    <text x="424" y="140" font-size="26" font-weight="700" fill="#b5651d">97 %</text>
  </g>

  <!-- graphique marge par affaire -->
  <text x="24" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#132743">Marge par affaire</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4a4a4a">
    <!-- axe -->
    <line x1="60" y1="380" x2="576" y2="380" stroke="#c9c5bc"/>

    <rect x="70" y="260" width="56" height="120" fill="#132743"/>
    <text x="98" y="396" text-anchor="middle">Affaire A</text>

    <rect x="156" y="300" width="56" height="80" fill="#132743"/>
    <text x="184" y="396" text-anchor="middle">Affaire B</text>

    <rect x="242" y="230" width="56" height="150" fill="#132743"/>
    <text x="270" y="396" text-anchor="middle">Affaire C</text>

    <rect x="328" y="330" width="56" height="50" fill="#b5651d"/>
    <text x="356" y="396" text-anchor="middle">Affaire D</text>

    <rect x="414" y="270" width="56" height="110" fill="#132743"/>
    <text x="442" y="396" text-anchor="middle">Affaire E</text>

    <rect x="500" y="345" width="56" height="35" fill="#b5651d"/>
    <text x="528" y="396" text-anchor="middle">Affaire F</text>
  </g>

  <text x="24" y="424" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8b877e">Exemple illustratif — données fictives, format du document remis chaque mois.</text>
</svg>
